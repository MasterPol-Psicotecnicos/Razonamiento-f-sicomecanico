<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aptitud Mecánica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: cuaderno de taller — barra superior fija, una columna de 880 px; solo la pregunta va en tarjeta */
:root {
  --bg: #FFFFFF; --surface: #FFFFFF; --surface2: #F4F6F9; --ink: #14233A; --ink2: #3A4B63; --muted: #5C6B80; --line: #D3DAE3;
  --brass: #A26E12; --brass-ink: #7A520C; --brass-soft: #F5E8CB; --on-acc: #FFFFFF;
  --ok: #1F7348; --ok-soft: #DDEFE4; --bad: #B42318; --bad-soft: #FADFDB;
  --water: #CFE4F5; --water-ink: #4F86B6; --oil: #F1DC93; --metal: #E1E6ED; --metal2: #C9D2DE; --beam: #DCCDB3; --rope: #7B5A30; --mA: #E2BF63; --mB: #AEB9C7;
  --figbg: #FFFFFF; --metal-hi: #FAFBFD; --metal-lo: #A9B5C4; --gside: #8E9BAD; --brass-hi: #FCF1D6; --brass-mid: #EBC97F; --brass-lo: #C08F2A;
  --wood-hi: #EEDFC2; --wood-lo: #CFAF7F; --grain: #B48F5E; --water-hi: #E1EEFA; --water-lo: #AFCFEC; --hub-hi: #FFFFFF; --hub-lo: #CDD5DF;
  --box-hi: #E6EBF1; --box-lo: #B9C4D2; --boxt: #F1F4F8; --boxs: #9AA9BC; --skin: #3A4B63; --car: #C9D3DF; --glass: #EAF2FA; --tire: #26303C;
  --f-disp: "Saira Condensed", "Arial Narrow", sans-serif; --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1622; --surface: #142133; --surface2: #1A293D; --ink: #E5EBF2; --ink2: #C3CEDB; --muted: #91A0B4; --line: #2A3B52;
    --brass: #E2AE4C; --brass-ink: #F0C774; --brass-soft: #3A2E14; --on-acc: #1A1306;
    --ok: #5DC48B; --ok-soft: #15301F; --bad: #F27B70; --bad-soft: #3B1816;
    --water: #1C3B59; --water-ink: #6FA7D8; --oil: #5E4E19; --metal: #24364D; --metal2: #31475F; --beam: #4C412E; --rope: #CDA574; --mA: #8E7028; --mB: #52627A;
    --figbg: #1A293D; --metal-hi: #435A78; --metal-lo: #1A293C; --gside: #0F1825; --brass-hi: #8A6A2A; --brass-mid: #6E531D; --brass-lo: #4A3712;
    --wood-hi: #6A5A3E; --wood-lo: #46392A; --grain: #2E261C; --water-hi: #2A5378; --water-lo: #183450; --hub-hi: #4A5F7E; --hub-lo: #22324A;
    --box-hi: #44587A; --box-lo: #2B3B52; --boxt: #51668A; --boxs: #1C2839; --skin: #C3CEDB; --car: #3B4E69; --glass: #22344B; --tire: #0A0F16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1622; --surface: #142133; --surface2: #1A293D; --ink: #E5EBF2; --ink2: #C3CEDB; --muted: #91A0B4; --line: #2A3B52;
  --brass: #E2AE4C; --brass-ink: #F0C774; --brass-soft: #3A2E14; --on-acc: #1A1306;
  --ok: #5DC48B; --ok-soft: #15301F; --bad: #F27B70; --bad-soft: #3B1816;
  --water: #1C3B59; --water-ink: #6FA7D8; --oil: #5E4E19; --metal: #24364D; --metal2: #31475F; --beam: #4C412E; --rope: #CDA574; --mA: #8E7028; --mB: #52627A;
    --figbg: #1A293D; --metal-hi: #435A78; --metal-lo: #1A293C; --gside: #0F1825; --brass-hi: #8A6A2A; --brass-mid: #6E531D; --brass-lo: #4A3712;
    --wood-hi: #6A5A3E; --wood-lo: #46392A; --grain: #2E261C; --water-hi: #2A5378; --water-lo: #183450; --hub-hi: #4A5F7E; --hub-lo: #22324A;
    --box-hi: #44587A; --box-lo: #2B3B52; --boxt: #51668A; --boxs: #1C2839; --skin: #C3CEDB; --car: #3B4E69; --glass: #22344B; --tire: #0A0F16;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 0; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--brass-ink); }
h1 { font-family: var(--f-disp); font-weight: 700; font-size: 30px; line-height: 1; margin: 3px 0 6px; letter-spacing: .005em; text-wrap: balance; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; font-weight: 600; font-size: 14px; color: var(--muted); padding: 10px 9px 9px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
body.in-session .tabs { display: none; }
body.in-session .top-in { padding-block: 8px 8px; }
body.in-session .eyebrow { display: none; }
body.in-session h1 { font-size: 20px; margin: 0; }
main { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; }

/* Botones y controles */
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 8px; cursor: pointer; line-height: 1.2; }
.btn:hover:not(:disabled) { border-color: var(--ink2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pri { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.acc { background: var(--brass); color: var(--on-acc); border-color: var(--brass); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.lg { padding: 13px 20px; font-size: 15px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
.lead { font-size: 15.5px; margin: 0 0 16px; max-width: 64ch; }
h2 { font-family: var(--f-disp); font-weight: 700; font-size: 22px; line-height: 1.1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; }
.section-t { font-family: var(--f-mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

/* Mapa */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sv { font-family: var(--f-disp); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.sv small { font-size: 17px; color: var(--muted); font-weight: 600; }
.sl { font-size: 12.5px; color: var(--muted); }
.meter { display: block; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--brass); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 18px 0 4px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 16px; height: 14px; border-radius: 4px; border: 1.5px dashed var(--line); display: inline-block; }
.sw.s1 { border: 1.5px solid var(--brass); background: var(--brass-soft); }
.sw.s2 { border: 1.5px solid var(--ok); background: var(--ok-soft); }
.sw.s3 { border: 1.5px solid var(--bad); background: var(--bad-soft); }
.cat { margin-top: 26px; }
.cat-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.cat-h .cnt { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.badge { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--ink2); color: var(--ink2); }
.badge.comp { border-color: var(--muted); color: var(--muted); border-style: dashed; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.sname { font-weight: 600; font-size: 14.5px; min-width: 0; }
.sname small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 1px; }
.cells { display: flex; gap: 6px; }
.cell { width: 56px; height: 46px; border-radius: 8px; border: 1.5px dashed var(--line); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 0; }
.cell b { font-family: var(--f-disp); font-size: 16px; line-height: 1; }
.cell span { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); line-height: 1; font-variant-numeric: tabular-nums; }
.cell:hover { border-color: var(--ink2); }
.cell.s1 { border-style: solid; border-color: var(--brass); background: var(--brass-soft); }
.cell.s2 { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.cell.s3 { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }
.cell.s1 span, .cell.s2 span, .cell.s3 span { color: var(--ink); }

/* Formularios de configuración */
.panel { display: grid; gap: 22px; }
.field { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface2); box-shadow: inset 0 0 0 1px var(--ink); }
.chip.mini { padding: 4px 10px; font-size: 12px; font-weight: 500; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { appearance: none; border: 0; background: transparent; padding: 9px 14px; font-weight: 600; font-size: 13.5px; color: var(--muted); cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.num { width: 76px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: 600 15px var(--f-mono); }
.presets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.preset { appearance: none; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.preset b { font-family: var(--f-disp); font-size: 18px; line-height: 1.1; }
.preset span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.preset[aria-pressed="true"] { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); background: var(--brass-soft); }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 0; max-width: 70ch; }
.summary-line { font-family: var(--f-mono); font-size: 13px; color: var(--ink2); }

/* Pregunta */
.qhead { display: flex; align-items: center; gap: 10px; }
.qcount { font-family: var(--f-disp); font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.qcount small { font-size: 16px; color: var(--muted); }
.qtime { margin-left: auto; font-family: var(--f-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.qtime.idle { color: var(--muted); font-size: 16px; }
.qtime.warn { color: var(--brass-ink); }
.qtime.crit { color: var(--bad); }
.tbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.tbar i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .25s linear; }
.qtag { font-size: 12.5px; color: var(--muted); margin: 14px 0 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lv { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; }
.lv1 { color: var(--ok); } .lv2 { color: var(--brass-ink); } .lv3 { color: var(--bad); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.figwrap { border: 1px solid var(--line); background: var(--figbg); border-radius: 8px; padding: 14px 10px; margin-bottom: 14px; display: flex; justify-content: center; overflow-x: auto; }
.figwrap .fig { max-width: 540px; }
.qtext { font-size: 16.5px; font-weight: 500; line-height: 1.45; margin: 0 0 14px; text-wrap: pretty; max-width: 68ch; }
.qdata { display: block; margin-top: 8px; font-family: var(--f-mono); font-size: 13px; color: var(--ink2); font-weight: 400; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 13px; font-weight: 500; font-size: 15px; cursor: pointer; width: 100%; }
.opt:hover:not(:disabled) { border-color: var(--ink2); }
.opt:disabled { cursor: default; }
.ol { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); font: 600 13px var(--f-mono); border: 1px solid var(--line); }
.ot { min-width: 0; }
.opt.sel { border-color: var(--ink); background: var(--surface2); }
.opt.sel .ol { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .ol { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ol { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.fb { margin-top: 14px; border-left: 4px solid var(--ok); background: var(--surface2); padding: 12px 14px; border-radius: 0 8px 8px 0; }
.fb.no { border-left-color: var(--bad); }
.fb h3 { margin: 0 0 4px; font-size: 15px; }
.fb p { margin: 0; font-size: 14.5px; line-height: 1.6; max-width: 70ch; }
.qnav { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.qnav .grow { flex: 1; }
.gridnav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.gn { width: 36px; height: 36px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font: 600 12px var(--f-mono); color: var(--muted); cursor: pointer; padding: 0; }
.gn.ans { background: var(--ink2); color: var(--surface); border-color: var(--ink2); }
.gn.cur { outline: 2px solid var(--brass); outline-offset: 1px; }
.gn.flag { box-shadow: inset 0 -4px 0 var(--brass); }
.gn:disabled { cursor: default; }
.confirm { margin-top: 14px; border: 1.5px solid var(--brass); background: var(--brass-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; }
.confirm p { margin: 0; font-size: 14.5px; }
.kbd { font-size: 12px; color: var(--muted); margin-top: 12px; }

/* Resultados */
.res-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.nota { font-family: var(--f-disp); font-weight: 700; font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; }
.nota small { font-size: 24px; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px 16px; }
.kv div { display: grid; }
.kv b { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.kv span { font-size: 12px; color: var(--muted); }
.k-ok { color: var(--ok); } .k-bad { color: var(--bad); }
.brk { display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) 110px 46px; gap: 10px; align-items: center; font-size: 13.5px; }
.bbar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bbar i { display: block; height: 100%; background: var(--ok); }
.brow .mono { text-align: right; font-size: 12.5px; }
.rev { display: grid; gap: 8px; }
.rev details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.rev summary { list-style: none; cursor: pointer; padding: 11px 14px; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; }
.rev summary::-webkit-details-marker { display: none; }
.rev .rn { font: 600 13px var(--f-mono); color: var(--muted); }
.rev .st { font: 600 12px var(--f-mono); padding: 2px 8px; border-radius: 99px; }
.st.ok { background: var(--ok-soft); color: var(--ok); } .st.no { background: var(--bad-soft); color: var(--bad); } .st.bl { background: var(--surface2); color: var(--muted); }
.rev .inner { padding: 0 14px 14px; }
.block { margin-top: 26px; }

/* Reglas e historial */
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.rule h2 { font-size: 19px; margin-bottom: 8px; }
.rule ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }
.rule .f { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface2); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
.hlist { display: grid; gap: 6px; }
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
.hrow .hn { font-family: var(--f-disp); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.hrow .hm { color: var(--muted); font-size: 12.5px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--brass); stroke-width: 2.5; stroke-linejoin: round; }
.chart .ar { fill: var(--brass-soft); }
.chart .pt { fill: var(--surface); stroke: var(--brass); stroke-width: 2; }
.chart .lt { fill: var(--muted); font: 11px var(--f-mono); }
.empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 10px; justify-items: start; }
.empty p { margin: 0; color: var(--muted); max-width: 56ch; }

/* Figuras SVG */
.fig { width: 100%; height: auto; max-height: 320px; display: block; overflow: visible; }
.fig * { vector-effect: non-scaling-stroke; }

function cellState(s, l) { const p = prog[ck(s, l)]; if (!p || !p.n) return 0; if (p.ok >= 3 && p.ok / p.n >= 0.8) return 2; if (p.n >= 2 && p.ok / p.n < 0.5) return 3; return 1; }
function record(q, ok) { const k = ck(q.sub, q.lvl), p = prog[k] || { n: 0, ok: 0 }; p.n++; if (ok) p.ok++; prog[k] = p; st.set('bam_prog', prog); }
const pressed = b => `aria-pressed="${b ? 'true' : 'false'}"`;

/* ---------- Navegación ---------- */

/* ---------- Mapa de cobertura ---------- */

  <p class="lead">${SUBS.length} tipos de ejercicio × 3 niveles = <b>${total} casillas</b>. Cada casilla genera ejercicios nuevos cada vez que entras. Toca una para practicar ese tipo y nivel.</p>
  <div class="stats">
    <div class="stat"><span class="sv">${cov}<small>/${total}</small></span><span class="sl">casillas revisadas</span><span class="meter"><i style="width:${(cov / total * 100).toFixed(1)}%"></i></span></div>

  ${CATS.map(c => {
    const done = c.subs.reduce((a, s) => a + [1, 2, 3].filter(l => prog[ck(s.id, l)]?.n).length, 0);

    ${c.subs.map(s => `<div class="row"><div class="sname">${s.name}${s.scene ? '<span class="kind">Elaborado</span>' : ''}<small>${s.lv.join(' · ')}</small></div><div class="cells">${[1, 2, 3].map(l => {
      const p = prog[ck(s.id, l)] || { n: 0, ok: 0 }, sv = cellState(s.id, l);
      return `<button class="cell s${sv}" data-act="cell" data-sub="${s.id}" data-l="${l}" title="${LVN[l]}: ${s.lv[l - 1]}" aria-label="${s.name}, nivel ${LVN[l]}: ${p.n ? p.ok + ' de ' + p.n : 'sin hacer'}"><b>${LVS[l]}</b><span>${p.n ? p.ok + '/' + p.n : '—'}</span></button>`;
    }).join('')}</div></div>`).join('')}</section>`;
  }).join('')}`;
}

function buildSpecs(subs, lvls, n, weights) {
  const out = []; let pool = [];
  for (let i = 0; i < n; i++) {
    if (!pool.length) pool = shuffle(subs);
    const s = pool.pop(); let l;
    if (weights) { let r = Math.random() * lvls.reduce((a, x) => a + weights[x], 0); l = lvls[0]; for (const x of lvls) { if ((r -= weights[x]) <= 0) { l = x; break; } } }
    else l = pick(lvls);
    out.push({ sub: s.id, lvl: l });
  }
  return out;
}
function practiceSpecs(p) {
  const subs = SUBS.filter(s => p.cats.includes(s.cat.id) && styleOK(s, p.style)), combos = []; subs.forEach(s => p.lv.forEach(l => combos.push({ sub: s.id, lvl: l })));
  const out = []; let pool = [];
  for (let i = 0; i < p.n; i++) { if (!pool.length) pool = shuffle(combos); out.push(pool.pop()); }
  return out;
}

/* ---------- Simulacro ---------- */
function simLimit(sp) { return sp.preset === 'custom' ? { n: sp.n, s: sp.min * 60 + sp.sec } : { n: PRESETS[sp.preset].n, s: PRESETS[sp.preset].s }; }
function renderSim() {
  const sp = prefs.sim, lim = simLimit(sp), perQ = lim.n ? lim.s / lim.n : 0;
  main.innerHTML = `<div class="panel">

    <p class="note">${sp.tm === 'total' ? 'Puedes moverte entre preguntas, marcarlas y cambiar respuestas hasta entregar.' : `Cada pregunta tiene ${nf(perQ, 1)} s; al agotarse pasa a la siguiente y no se puede volver atrás.`}</p></div>
  <div class="field"><p class="section-t">Dificultad</p><div class="chips">${[1, 2, 3].map(l => `<button class="chip" data-act="simlv" data-l="${l}" ${pressed(sp.lv.includes(l))}>${LVN[l]}</button>`).join('')}</div>
    <p class="note">Con los tres niveles activos, el reparto es 30 % básico, 50 % medio y 20 % avanzado.</p></div>
  <div class="field"><p class="section-t">Contenido</p><div class="seg">${[['core', 'Núcleo mecánico'], ['all', 'Todo, con complementarios']].map(([k, t]) => `<button data-act="simscope" data-k="${k}" ${pressed(sp.scope === k)}>${t}</button>`).join('')}</div>
    <p class="note">Complementarios: centro de gravedad, electricidad básica y calor. Aparecen en muchas baterías de aptitud mecánica, aunque las guías de Tropa no los citan expresamente.</p></div>
  ${styleField(sp.style, 'simstyle')}
  <div class="field"><p class="section-t">Penalización</p><div class="seg">${PENAL.map(([v, t], i) => `<button data-act="simpenal" data-i="${i}" ${pressed(Math.abs(sp.penal - v) < 1e-6)}>${t}</button>`).join('')}</div>
    <p class="note">Por defecto, sin penalización. Actívala si las instrucciones de tu prueba indican que los fallos restan.</p></div>
  <div class="actions"><button class="btn acc lg" data-act="simstart" ${sp.lv.length && lim.n > 0 && lim.s > 0 ? '' : 'disabled'}>Empezar simulacro</button></div>

/* ---------- Sesión ---------- */
function startSession(mode, specs, o = {}) {
  const items = specs.map(sp => ({ q: sp.q || genItem(SUBMAP[sp.sub], sp.lvl), ans: null, t: 0, flag: false, locked: false, to: false }));
  const now = Date.now();
  S = { mode, title: o.title, items, i: 0, fb: !!o.fb, tm: o.tm || 'none', lim: o.lim || 0, penal: o.penal || 0, start: now, qStart: now, done: false };
  if (S.tm === 'total') S.deadline = now + S.lim * 1000;
  if (S.tm === 'q') S.qDeadline = now + S.lim * 1000;
  ui.exit = ui.submit = false; startTick(); render(); window.scrollTo(0, 0);
}
function startTick() { stopTick(); timerId = setInterval(onTick, 250); onTick(); }
function stopTick() { if (timerId) { clearInterval(timerId); timerId = null; } }
function onTick() {
  if (!S || S.done) { stopTick(); return; }
  const now = Date.now(), el = document.getElementById('qtime'), bar = document.getElementById('tbar'); let rem = null, frac = 0;
  if (S.tm === 'total') { rem = (S.deadline - now) / 1000; frac = rem / S.lim; if (rem <= 0) { finish(true); return; } }
  else if (S.tm === 'q') { const it = S.items[S.i]; if (!it.locked) { rem = (S.qDeadline - now) / 1000; frac = rem / S.lim; if (rem <= 0) { qTimeout(); return; } } }
  if (el) {
    if (rem != null) { el.textContent = mmss(Math.ceil(rem)); el.className = 'qtime' + (frac < 0.1 ? ' crit' : frac < 0.25 ? ' warn' : ''); }
    else if (S.tm === 'none') { el.textContent = mmss((now - S.start) / 1000); el.className = 'qtime idle'; }
  }
  if (bar && rem != null) bar.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(1) + '%';
}
function accTime() { const now = Date.now(), it = S.items[S.i]; if (!it.locked || S.fb) it.t += now - S.qStart; S.qStart = now; }
function qTimeout() {
  const it = S.items[S.i]; accTime(); it.to = true; it.locked = true;
  if (S.fb) { record(it.q, false); render(); } else next(true);
}
function answer(k) {
  const it = S.items[S.i]; if (it.locked || S.done) return;
  if (S.fb) { it.ans = k; accTime(); it.locked = true; record(it.q, k === it.q.correct); render(); }
  else { it.ans = it.ans === k ? null : k; render(); }
}
function reveal() { const it = S.items[S.i]; if (it.locked) return; accTime(); it.locked = true; record(it.q, false); render(); }
function goTo(i) { accTime(); S.i = i; S.qStart = Date.now(); if (S.tm === 'q' && !S.items[i].locked) S.qDeadline = S.qStart + S.lim * 1000; ui.submit = ui.exit = false; render(); document.querySelector('.qhead')?.scrollIntoView({ block: 'start' }); }
function next(auto) {
  if (S.tm === 'q' && !S.fb) S.items[S.i].locked = true;
  if (S.i < S.items.length - 1) { goTo(S.i + 1); return; }
  if (S.fb || S.tm === 'q' || auto) finish(false); else { ui.submit = true; render(); }
}
function score(s) {
  const n = s.items.length, ok = s.items.filter(it => it.ans === it.q.correct).length, err = s.items.filter(it => it.ans != null && it.ans !== it.q.correct).length;
  const raw = ok - s.penal * err; return { n, ok, err, bl: n - ok - err, raw, nota: Math.max(0, raw) / n * 10, secs: ((s.end || Date.now()) - s.start) / 1000 };
}
function finish(timeUp) {
  if (!S || S.done) return; accTime(); S.done = true; S.end = Date.now(); S.timeUp = !!timeUp; stopTick();
  if (!S.fb) S.items.forEach(it => record(it.q, it.ans === it.q.correct));
  const r = score(S), cats = {};
  S.items.forEach(it => { const c = it.q.cat; cats[c] = cats[c] || [0, 0]; cats[c][1]++; if (it.ans === it.q.correct) cats[c][0]++; });
  hist.unshift({ d: new Date().toISOString(), mode: S.mode, title: S.title, n: r.n, ok: r.ok, err: r.err, bl: r.bl, nota: r.nota, secs: r.secs, lim: S.tm === 'total' ? S.lim : S.tm === 'q' ? S.lim * r.n : 0, tm: S.tm, penal: S.penal, cats });
  hist = hist.slice(0, 300); st.set('bam_hist', hist);
  ui.exit = ui.submit = false; render(); window.scrollTo(0, 0);
}
function exitSession() { stopTick(); S = null; ui.exit = false; render(); window.scrollTo(0, 0); }

function optHTML(q, it, k, mode) {
  let c = '';
  if (mode === 'review' || (it.locked && S && S.fb)) { if (k === q.correct) c = 'right'; else if (k === it.ans) c = 'wrong'; }
  else if (k === it.ans) c = 'sel';
  const dis = mode === 'review' || it.locked;
  if (!q.options[k].startsWith('<svg') && q.options.some(o => o.startsWith('<svg'))) c += ' txt';
  return `<button class="opt ${c}" data-act="ans" data-k="${k}" ${dis ? 'disabled' : ''}><span class="ol">${'ABCD'[k]}</span><span class="ot">${q.options[k]}</span></button>`;
}
function qBody(q, it, mode) {
  const sub = SUBMAP[q.sub];
  return `<div class="qtag"><span>${sub.cat.name} · ${sub.name}</span><span class="lv lv${q.lvl}">${LVN[q.lvl]}</span></div>
  <article class="qcard">${q.fig ? `<div class="figwrap">${q.fig}</div>` : ''}<p class="qtext">${q.text}</p>
  <div class="opts${q.options.some(o => o.startsWith('<svg')) ? ' img' : ''}">${q.options.map((_, k) => optHTML(q, it, k, mode)).join('')}</div>
  ${(mode === 'review' || (S && S.fb && it.locked)) ? fbHTML(q, it) : ''}</article>`;
}
function fbHTML(q, it) {
  const ok = it.ans === q.correct, head = ok ? 'Correcto' : it.to ? 'Tiempo agotado' : it.ans == null ? 'Sin responder' : 'Incorrecto';
  return `<div class="fb ${ok ? '' : 'no'}"><h3>${head}${ok ? '' : ` · la respuesta es ${'ABCD'[q.correct]}`}</h3><p>${q.expl}</p></div>`;
}
function renderQuiz() {
  const it = S.items[S.i], q = it.q, N = S.items.length, last = S.i === N - 1, sim = !S.fb, perQ = S.tm === 'q';
  const answered = S.items.filter(x => x.ans != null).length;
  let nav;
  if (!sim) {
    nav = `<div class="qnav">${it.locked ? `<button class="btn pri" data-act="next">${last ? 'Ver resultados' : 'Siguiente →'}</button>` : `<button class="btn ghost" data-act="reveal">Ver solución</button>`}<span class="grow"></span><button class="btn ghost" data-act="exit">Salir</button></div>`;
  } else {
    nav = `<div class="qnav">${perQ ? '' : `<button class="btn" data-act="prev" ${S.i ? '' : 'disabled'}>← Anterior</button>`}
      ${perQ ? '' : `<button class="btn ghost" data-act="flag">${it.flag ? 'Quitar marca' : 'Marcar'}</button>`}<span class="grow"></span>
      ${last ? `<button class="btn pri" data-act="${perQ ? 'next' : 'submit'}">Entregar</button>` : `<button class="btn pri" data-act="next">Siguiente →</button>`}</div>
      ${perQ ? '' : `<div class="gridnav">${S.items.map((x, k) => `<button class="gn ${x.ans != null ? 'ans' : ''} ${k === S.i ? 'cur' : ''} ${x.flag ? 'flag' : ''}" data-act="go" data-i="${k}" aria-label="Pregunta ${k + 1}">${k + 1}</button>`).join('')}</div>`}
      <div class="qnav"><span class="hint">${answered}/${N} respondidas${S.penal ? ` · los fallos restan ${S.penal === 0.25 ? '¼' : '⅓'}` : ''}</span><span class="grow"></span><button class="btn ghost" data-act="submit">Entregar ya</button><button class="btn ghost" data-act="exit">Salir</button></div>`;
  }
  let conf = '';
  if (ui.submit) { const bl = N - answered; conf = `<div class="confirm"><p>${bl ? `Te quedan <b>${bl} sin responder</b>${S.penal ? '' : ' y no restan, así que conviene contestarlas'}.` : 'Has respondido todas.'} ¿Entregar el simulacro?</p><div class="actions"><button class="btn acc" data-act="dosubmit">Entregar</button><button class="btn" data-act="nosubmit">Seguir</button></div></div>`; }
  if (ui.exit) conf = `<div class="confirm"><p>${sim ? 'Si sales ahora, este simulacro no se guardará.' : 'Lo que ya has respondido queda guardado en el mapa.'} ¿Salir?</p><div class="actions"><button class="btn danger" data-act="doexit">Salir</button><button class="btn" data-act="noexit">Seguir</button></div></div>`;
  main.innerHTML = `<section class="quiz"><div class="qhead"><span class="qcount">${S.i + 1}<small>/${N}</small></span><span class="hint">${S.title || ''}</span><span class="qtime mono" id="qtime"></span></div>
    ${S.tm !== 'none' ? '<div class="tbar"><i id="tbar"></i></div>' : ''}
    ${qBody(q, it, 'quiz')}${nav}${conf}

}
function renderResults() {
  const r = score(S), sim = !S.fb, used = r.secs, limTot = S.tm === 'total' ? S.lim : S.tm === 'q' ? S.lim * r.n : 0;
  const byCat = CATS.map(c => { const its = S.items.filter(it => it.q.cat === c.id); return { c, n: its.length, ok: its.filter(it => it.ans === it.q.correct).length }; }).filter(x => x.n);
  const fails = S.items.filter(it => it.ans !== it.q.correct);
  main.innerHTML = `<section>
  <p class="section-t">${sim ? 'Simulacro terminado' : 'Práctica terminada'}${S.timeUp ? ' · se agotó el tiempo' : ''}</p>
  <div class="res-top"><div class="nota">${nf(r.nota)}<small>/10</small></div>
    <div class="kv"><div><b class="k-ok">${r.ok}</b><span>aciertos</span></div><div><b class="k-bad">${r.err}</b><span>errores</span></div><div><b>${r.bl}</b><span>en blanco</span></div>
    <div><b>${mmss(used)}</b><span>${limTot ? 'de ' + mmss(limTot) : 'tiempo'}</span></div><div><b>${nf(used / r.n, 1)} s</b><span>por pregunta</span></div></div></div>
  ${S.penal ? `<p class="hint">Nota = (aciertos − ${S.penal === 0.25 ? '¼' : '⅓'} × errores) ÷ preguntas × 10 = (${r.ok} − ${nf(S.penal * r.err)}) ÷ ${r.n} × 10.</p>` : `<p class="hint">Nota = aciertos ÷ preguntas × 10. Los fallos no restan.</p>`}
  <div class="actions" style="margin-top:14px">${fails.length ? `<button class="btn acc" data-act="redo">Repasar ${fails.length} ${fails.length === 1 ? 'fallo' : 'fallos'}</button>` : ''}<button class="btn pri" data-act="again">${sim ? 'Nuevo simulacro' : 'Otra práctica'}</button><button class="btn" data-act="tomap">Ver el mapa</button></div>
  <div class="block"><p class="section-t">Por bloques</p><div class="brk">${byCat.map(x => `<div class="brow"><span>${x.c.name}</span><span class="bbar"><i style="width:${(x.ok / x.n * 100).toFixed(0)}%"></i></span><span class="mono">${x.ok}/${x.n}</span></div>`).join('')}</div></div>
  <div class="block"><p class="section-t">Revisión pregunta a pregunta</p><div class="rev">${S.items.map((it, k) => {
    const ok = it.ans === it.q.correct, sub = SUBMAP[it.q.sub];
    return `<details${!ok && fails.length <= 5 ? ' open' : ''}><summary><span class="rn">${k + 1}</span><span>${sub.name} · ${LVN[it.q.lvl]}</span><span class="st ${ok ? 'ok' : it.ans == null ? 'bl' : 'no'}">${ok ? 'Acierto' : it.ans == null ? (it.to ? 'Sin tiempo' : 'En blanco') : 'Fallo'}</span></summary><div class="inner">${qBody(it.q, it, 'review')}</div></details>`;
  }).join('')}</div></div></section>`;
}

/* ---------- Reglas ---------- */
const RULES = [
  ['Engranajes', ['Dos ruedas en contacto giran en <b>sentidos contrarios</b>: con un número par de contactos, igual que la primera; impar, al revés.', 'Un circuito cerrado con número <b>impar</b> de ruedas se bloquea.', 'Dientes × vueltas se conserva: <span class="f">n₁·Z₁ = n₂·Z₂</span>. La rueda pequeña gira más rápido.', 'La rueda intermedia («loca») solo cambia el sentido, no la velocidad.', 'Ruedas en el mismo eje giran juntas: misma velocidad y sentido.']],
  ['Correas y mecanismos', ['Correa abierta: <b>mismo sentido</b>. Correa cruzada: <b>sentido contrario</b>.', 'Con poleas: <span class="f">n₁·D₁ = n₂·D₂</span>.', 'Bicicleta: vueltas de la rueda por pedalada = dientes del plato ÷ dientes del piñón.', 'Cremallera: avance = vueltas × dientes × paso. Tornillo sin fin de una entrada: una vuelta = un diente.', 'Biela-manivela: carrera = 2 × radio. Leva excéntrica: subida = 2 × excentricidad.']],
  ['Poleas', ['Polea fija: <span class="f">F = P</span>, solo cambia la dirección.', 'Polea móvil: <span class="f">F = P ÷ 2</span>.', 'Polipasto: <span class="f">F = P ÷ n</span>, con n = tramos que sujetan la carga (el extremo del que tiras no cuenta si baja de una polea fija).', 'Cuerda a recoger = n × altura. Lo que ganas en fuerza lo pierdes en recorrido.', 'Si la cuerda pasa por encima de una polea gira en un sentido; por debajo, en el contrario.']],
  ['Palancas', ['Ley: <span class="f">F × bF = R × bR</span> (fuerza por su brazo = carga por su brazo).', '1.º género: apoyo en medio (tijeras, balancín). 2.º: carga en medio (carretilla, cascanueces), siempre ahorra fuerza. 3.º: fuerza en medio (pinzas, caña), nunca ahorra fuerza.', 'Balanza: baja el lado con mayor <b>momento</b> (peso × distancia), no el que más pesa.', 'Menos esfuerzo: empuja lejos del apoyo o acerca el apoyo a la carga.']],
  ['Plano inclinado, cuña y tornillo', ['<span class="f">F = P × h ÷ L</span>. Rampa más larga = menos fuerza.', 'El trabajo (P × h) es el mismo por cualquier rampa.', 'Cuña más larga y afilada entra con menos esfuerzo.', 'Tornillo: avance por vuelta = paso × entradas.']],
  ['Fluidos', ['Pascal: la presión se transmite igual. <span class="f">F₁/A₁ = F₂/A₂</span>. Con diámetros, el área va al cuadrado.', 'El émbolo pequeño recorre más; el grande hace más fuerza.', '<span class="f">p = ρ·g·h</span>: solo depende de la profundidad, no de la forma ni de la cantidad. 10 m de agua ≈ 100 kPa.', 'Vasos comunicantes: mismo nivel. Dos líquidos: <span class="f">h₁·ρ₁ = h₂·ρ₂</span>.', 'Flota si es menos denso que el líquido. Parte sumergida = ρ cuerpo ÷ ρ líquido. Empuje = peso del líquido desalojado.']],
  ['Movimiento e inercia', ['Inercia: el cuerpo sigue como iba. Frenazo → hacia delante; arranque → hacia atrás; curva → hacia fuera.', 'Al soltarse de un giro sale en línea recta tangente.', 'Sin aire todo cae a la vez. <span class="f">h = 5·t²</span>, <span class="f">v = 10·t</span>.', 'El periodo del péndulo solo depende de la longitud: ×4 longitud → ×2 tiempo.', 'En una rueda todos los puntos dan las mismas vueltas; el borde va más rápido.']],
  ['Estructuras y tracción', ['El triángulo es indeformable; la diagonal rigidiza un rectángulo.', 'Una viga resiste más de canto. Con carga central se rompe por el centro.', 'Reparto entre apoyos: el más cercano a la carga soporta más. <span class="f">R_A = P × d_B ÷ L</span>.', 'Cuerdas más abiertas = más tensión. A 60° de la vertical cada cuerda soporta todo el peso.', 'Muelles: alargamiento proporcional al peso. En serie se suman; en paralelo se reparte.']],
  ['Centro de gravedad', ['Más estable: base ancha y centro de gravedad bajo.', 'Vuelca si la vertical del centro de gravedad cae fuera de la base.', 'Dos masas: <span class="f">x = m₂·L ÷ (m₁ + m₂)</span>, más cerca de la más pesada.', 'Un objeto colgado queda con su centro de gravedad bajo el punto de suspensión.']],
  ['Electricidad y calor', ['Serie: un interruptor abierto o una lámpara fundida apaga todo el tramo.', 'Paralelo: cada rama va por su cuenta; la lámpara sola en su rama brilla más.', 'Ohm: <span class="f">I = V ÷ R</span>. Serie: R₁ + R₂. Dos iguales en paralelo: R ÷ 2.', 'Dilatación: <span class="f">ΔL = α·L·ΔT</span>. Bimetal al calentar: se curva hacia el metal que menos dilata.', 'Conducción (metales), convección (el fluido caliente sube), radiación (sin contacto; lo oscuro absorbe más).']]
];
function renderRules() {
  main.innerHTML = `<p class="lead">Las reglas que resuelven la mayoría de preguntas. Repásalas antes de cada simulacro.</p>
  <div class="rules">${RULES.map(([t, l]) => `<section class="rule"><h2>${t}</h2><ul>${l.map(x => `<li>${x}</li>`).join('')}</ul></section>`).join('')}</div>`;
}

/* ---------- Historial ---------- */
function renderHist() {
  const sims = hist.filter(h => h.mode === 'simulacro');
  let chart = '';
  if (sims.length >= 2) {
    const pts = sims.slice(0, 20).reverse(), W = 560, H = 170, px = 34, py = 14, x = i => px + (W - px - 12) * (pts.length === 1 ? 0.5 : i / (pts.length - 1)), y = v => py + (H - 2 * py - 10) * (1 - v / 10);
    const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.nota).toFixed(1)}`).join(' ');
    chart = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de la nota en los últimos simulacros">
      ${[0, 5, 10].map(v => `<line class="gl" x1="${px}" x2="${W - 12}" y1="${y(v)}" y2="${y(v)}"/><text class="lt" x="${px - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
      <polygon class="ar" points="${x(0)},${y(0)} ${line} ${x(pts.length - 1)},${y(0)}"/><polyline class="ln" points="${line}"/>
      ${pts.map((p, i) => `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(p.nota).toFixed(1)}" r="${i === pts.length - 1 ? 5 : 3.5}"/>`).join('')}
      <text class="lt" x="${x(pts.length - 1)}" y="${y(pts[pts.length - 1].nota) - 10}" text-anchor="end">${nf(pts[pts.length - 1].nota)}</text></svg></div>`;
  }
  const date = iso => { const d = new Date(iso); return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); };
  main.innerHTML = `${hist.length ? `
    ${sims.length ? `<div class="stats"><div class="stat"><span class="sv">${sims.length}</span><span class="sl">simulacros</span></div><div class="stat"><span class="sv">${nf(sims.reduce((a, h) => a + h.nota, 0) / sims.length)}</span><span class="sl">nota media</span></div><div class="stat"><span class="sv">${nf(Math.max(...sims.map(h => h.nota)))}</span><span class="sl">mejor nota</span></div></div>` : ''}
    ${chart}
    <div class="block"><p class="section-t">Sesiones</p><div class="hlist">${hist.slice(0, 60).map(h => `<div class="hrow"><div><b>${h.mode === 'simulacro' ? 'Simulacro' : h.title || 'Práctica'}</b><div class="hm">${date(h.d)} · ${h.ok}/${h.n} aciertos${h.lim ? ` · ${mmss(h.secs)} de ${mmss(h.lim)}` : ` · ${mmss(h.secs)}`}</div></div><span class="hm hm2">${h.err} err · ${h.bl} blanco</span><span class="hn">${nf(h.nota)}</span></div>`).join('')}</div></div>`
    : `<div class="empty"><h2>Aún no hay sesiones</h2><p>Cuando termines un simulacro o una práctica, aparecerá aquí con su nota, su tiempo y la evolución de tus resultados.</p><button class="btn acc" data-act="gosim">Hacer un simulacro</button></div>`}
  <div class="block"><p class="section-t">Datos guardados en este navegador</p>
  ${ui.reset ? `<div class="confirm"><p>Se borrarán el mapa de cobertura y el historial. No se puede deshacer.</p><div class="actions"><button class="btn danger" data-act="doreset">Borrar todo</button><button class="btn" data-act="noreset">Cancelar</button></div></div>` : `<button class="btn danger" data-act="reset">Borrar progreso e historial</button>`}</div>`;
}

/* ---------- Eventos ---------- */
let bn = st.get('bam_bn', false); const bnBtn = document.getElementById('bntog');
const applyBn = () => { document.body.classList.toggle('bn', bn); bnBtn.setAttribute('aria-pressed', bn ? 'true' : 'false'); };
bnBtn.addEventListener('click', () => { bn = !bn; st.set('bam_bn', bn); applyBn(); }); applyBn();
document.querySelector('.tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) setView(t.dataset.v); });
main.addEventListener('input', e => {
  const id = e.target.id, v = Math.max(0, parseInt(e.target.value, 10) || 0);
  if (id === 'pr-tq') prefs.pr.tq = Math.max(5, v); else if (id === 'pr-tt') prefs.pr.tt = Math.max(1, v);
  else if (id === 'sim-n') prefs.sim.n = Math.min(96, Math.max(1, v)); else if (id === 'sim-min') prefs.sim.min = v; else if (id === 'sim-sec') prefs.sim.sec = Math.min(59, v);
  else return;
  savePrefs(); const sl = main.querySelector('.summary-line');
  if (sl && view === 'simulacro') { const lim = simLimit(prefs.sim); sl.textContent = `${lim.n} preguntas · ${mmss(lim.s)} · ${nf(lim.n ? lim.s / lim.n : 0, 1)} s por pregunta`; }
});
main.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, p = prefs.pr, sp = prefs.sim, tog = (arr, v) => (arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]);
  switch (a) {
    case 'cell': startSession('practica', Array.from({ length: 5 }, () => ({ sub: b.dataset.sub, lvl: +b.dataset.l })), { fb: true, title: 'Casilla del mapa' }); return;
    case 'revfull': startSession('revision', SUBS.flatMap(s => [1, 2, 3].map(l => ({ sub: s.id, lvl: l }))), { fb: true, title: 'Revisión completa' }); return;
    case 'revpend': startSession('revision', SUBS.flatMap(s => [1, 2, 3].filter(l => !prog[ck(s.id, l)]?.n).map(l => ({ sub: s.id, lvl: l }))), { fb: true, title: 'Casillas pendientes' }); return;
    case 'revweak': startSession('revision', SUBS.flatMap(s => [1, 2, 3].filter(l => cellState(s.id, l) === 3).flatMap(l => [{ sub: s.id, lvl: l }, { sub: s.id, lvl: l }])), { fb: true, title: 'Refuerzo de casillas flojas' }); return;
    case 'prcat': p.cats = tog(p.cats, b.dataset.id); break;
    case 'prall': p.cats = CATS.map(c => c.id); break;
    case 'prcore': p.cats = CATS.filter(c => c.core).map(c => c.id); break;
    case 'prnone': p.cats = []; break;
    case 'prlv': p.lv = tog(p.lv, +b.dataset.l).sort(); break;
    case 'prn': p.n = +b.dataset.n; break;
    case 'prtm': p.tm = b.dataset.k; break;
    case 'prstart': savePrefs(); startSession('practica', practiceSpecs(p), { fb: true, title: 'Práctica', tm: p.tm, lim: p.tm === 'q' ? p.tq : p.tt * 60 }); return;
    case 'simpre': sp.preset = b.dataset.k; break;
    case 'simtm': sp.tm = b.dataset.k; break;
    case 'simlv': sp.lv = tog(sp.lv, +b.dataset.l).sort(); break;
    case 'simscope': sp.scope = b.dataset.k; break;
    case 'simstyle': sp.style = b.dataset.k; break;
    case 'prstyle': p.style = b.dataset.k; break;
    case 'simpenal': sp.penal = PENAL[+b.dataset.i][0]; break;
    case 'simstart': {
      savePrefs(); const lim = simLimit(sp), subs = SUBS.filter(s => (sp.scope === 'all' || s.cat.core) && styleOK(s, sp.style));
      const specs = buildSpecs(subs, sp.lv, lim.n, sp.lv.length === 3 ? { 1: 0.3, 2: 0.5, 3: 0.2 } : null);
      startSession('simulacro', specs, { fb: false, title: 'Simulacro', tm: sp.tm, lim: sp.tm === 'q' ? lim.s / lim.n : lim.s, penal: sp.penal }); return;
    }
    case 'ans': answer(+b.dataset.k); return;
    case 'reveal': reveal(); return;
    case 'next': next(false); return;
    case 'prev': if (S.i > 0) goTo(S.i - 1); return;
    case 'go': goTo(+b.dataset.i); return;
    case 'flag': S.items[S.i].flag = !S.items[S.i].flag; render(); return;
    case 'submit': ui.submit = true; ui.exit = false; render(); main.querySelector('.confirm')?.scrollIntoView({ block: 'nearest' }); return;
    case 'dosubmit': finish(false); return;
    case 'nosubmit': ui.submit = false; render(); return;
    case 'exit': ui.exit = true; ui.submit = false; render(); main.querySelector('.confirm')?.scrollIntoView({ block: 'nearest' }); return;
    case 'doexit': exitSession(); return;
    case 'noexit': ui.exit = false; render(); return;
    case 'redo': { const f = S.items.filter(it => it.ans !== it.q.correct).map(it => ({ q: it.q })); startSession('practica', f, { fb: true, title: 'Repaso de fallos' }); return; }
    case 'again': { const m = S.mode === 'simulacro' ? 'simulacro' : 'practica'; S = null; setView(m); return; }
    case 'tomap': S = null; setView('mapa'); return;
    case 'gosim': setView('simulacro'); return;
    case 'reset': ui.reset = true; break;
    case 'noreset': ui.reset = false; break;
    case 'doreset': prog = {}; hist = []; st.set('bam_prog', prog); st.set('bam_hist', hist); ui.reset = false; break;
    default: return;
  }
  savePrefs(); render();
});
document.addEventListener('keydown', e => {
  if (!S || S.done || e.target.closest('input') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), it = S.items[S.i], idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (idx >= 0 && idx < it.q.options.length && k.length === 1) { answer(idx); e.preventDefault(); }
  else if (k === 'enter' || k === 'arrowright') {
    if (ui.submit || ui.exit) return;
    if (S.fb ? it.locked : (k === 'enter' || S.tm !== 'q')) { if (!S.fb && S.tm !== 'q' && k === 'arrowright' && S.i === S.items.length - 1) return; next(false); e.preventDefault(); }
  } else if (k === 'arrowleft' && !S.fb && S.tm !== 'q' && S.i > 0) { goTo(S.i - 1); e.preventDefault(); }
});
render();

</script>
